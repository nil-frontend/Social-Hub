<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sh-bg" x1="60" y1="0" x2="60" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E1E22" />
      <stop offset="100%" stop-color="#0B0B0D" />
    </linearGradient>

    <linearGradient id="sh-blue-stream" x1="60" y1="60" x2="60" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0066CC" />
      <stop offset="100%" stop-color="#2997FF" />
    </linearGradient>

    <linearGradient id="sh-left-stream" x1="60" y1="60" x2="28" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0066CC" />
      <stop offset="100%" stop-color="#5E5CE6" />
    </linearGradient>

    <linearGradient id="sh-right-stream" x1="60" y1="60" x2="92" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0066CC" />
      <stop offset="100%" stop-color="#00C7BE" />
    </linearGradient>

    <linearGradient id="sh-core" x1="50" y1="50" x2="70" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#D2E9FF" />
    </linearGradient>

    <radialGradient id="sh-glow" cx="60" cy="60" r="35" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0071E3" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#0071E3" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0071E3" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Apple-Spec Squircle Container -->
  <rect x="2" y="2" width="116" height="116" rx="28" fill="url(#sh-bg)" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1.5" />

  <!-- Internal Ambient Radial Glow -->
  <circle cx="60" cy="60" r="42" fill="url(#sh-glow)" />

  <!-- Minimalist Constellation Orbit -->
  <circle cx="60" cy="60" r="36" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" stroke-dasharray="3 4" />

  <!-- Vector Transmission Conduits -->
  <line x1="60" y1="57" x2="60" y2="28" stroke="url(#sh-blue-stream)" stroke-width="3.5" stroke-linecap="round" />
  <line x1="57" y1="62" x2="31" y2="78" stroke="url(#sh-left-stream)" stroke-width="3.5" stroke-linecap="round" />
  <line x1="63" y1="62" x2="89" y2="78" stroke="url(#sh-right-stream)" stroke-width="3.5" stroke-linecap="round" />

  <!-- Destination Satellite Broadcast Nodes -->
  <circle cx="60" cy="27" r="8" fill="#2997FF" />
  <circle cx="60" cy="27" r="4.5" fill="#FFFFFF" />

  <circle cx="30" cy="79" r="7.5" fill="#5E5CE6" />
  <circle cx="30" cy="79" r="4" fill="#FFFFFF" />

  <circle cx="90" cy="79" r="7.5" fill="#00C7BE" />
  <circle cx="90" cy="79" r="4" fill="#FFFFFF" />

  <!-- Center Master Studio Transmitter Core -->
  <circle cx="60" cy="60" r="14" fill="url(#sh-core)" stroke="#0066CC" stroke-width="2.5" />
  <polygon points="57,53 66,60 57,67" fill="#0066CC" />
</svg>
